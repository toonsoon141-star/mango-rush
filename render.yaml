# MANGO RUSH — Render Blueprint
# Deploy: push this repo to GitHub → Render Dashboard → "New +" → Blueprint.
services:
  - type: web
    name: mango-rush
    runtime: docker
    plan: starter            # needs a persistent disk (paid plan)
    healthCheckPath: /api/health
    disk:
      name: mango-data       # SQLite DB lives here (survives redeploys)
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: BOT_TOKEN
        sync: false          # paste your token in the Render dashboard (kept secret)
      - key: BOT_USERNAME
        value: Mango_Rush0_bot
      - key: APP_SHORT
        value: app
      - key: DB_PATH
        value: /app/data/data.db
      - key: WITHDRAW_CHANNEL
        value: "@MangoRush_Proof"
      - key: MIN_WITHDRAW_USDT
        value: "0.1"
      - key: WITHDRAW_FEE_PCT
        value: "20"
      - key: APP_NAME
        value: "MANGO RUSH"
      - key: PORT
        value: "3000"
      # DEMO_MODE must NOT be set in production.
